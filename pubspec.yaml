name: world_of_rice
description: "World Of Rice - Premium Rice Delivery App"
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.3.0

  # UI / Fonts
  google_fonts: ^6.2.1
  smooth_page_indicator: ^1.2.0+3

  # Icons
  cupertino_icons: ^1.0.8

  # Payment
  razorpay_flutter: ^1.3.6

  # Networking
  http: ^1.2.1

  # Local storage
  shared_preferences: ^2.3.2

  # Location
  geolocator: ^13.0.2

  # URL launching (policy pages, external links)
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^9.1.7
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # fonts are loaded via google_fonts at runtime
