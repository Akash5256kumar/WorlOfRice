flutter_launcher_icons:
  # Android
  android: "launcher_icon"
  min_sdk_android: 21
  image_path: "assets/images/logo.png"
  # Android adaptive icon (API 26+) — foreground + background
  adaptive_icon_background: "#2C1F0E"
  adaptive_icon_foreground: "assets/images/logo.png"

  # iOS
  ios: true
  remove_alpha_ios: true   # App Store rejects icons with transparency

  # Web / desktop — not required for this project
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false
